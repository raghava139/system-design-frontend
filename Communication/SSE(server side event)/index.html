<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Side Events</title>
</head>

<body>
    <h1>Server Side Events Example</h1>
    <div id="data-sse"></div>
</body>

<script>
    const events = new EventSource("/events");

    events.onmessage = (event) => {
        console.log(event.data)

        document.getElementById('data-sse').innerHTML += `<p>${event.data}</p>`
    }
</script>

</html>
